<!DOCTYPE html>
<html>
<head>
    <title>Product Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-purple-50">

    <!-- Header -->
    <header class="bg-purple-800 text-white p-3">

    <div class="p-4">
        <h2 class="text-2xl text-center mb-4">Our Products</h2>

        <div class="flex flex-wrap justify-center gap-6">

            <!-- Product 1 -->
            <div class="bg-blue-100 p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3bGZquTmyZtrsQTPSy9OX9FAazU_OvKS-LaBweiKNkw&s=10" class="w-full">
                <h3 class="text-xl">Laptop</h3>
                <p>Price: ₹70,999</p>
                <button class="bg-blue-600 text-white p-2 mt-2">Buy Now</button>
            </div>

            <!-- Product 2 -->
            <div class="bg-blue-100 p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgK_9TnaNaCMbZwMCb52RRoQzcDJTvQUEBuY3dDdfGFA&s" class="w-full">
                <h3 class="text-xl">Mobile</h3>
                <p>Price: ₹24,999</p>
                <button class="bg-blue-600 text-white p-2 mt-2">Buy Now</button>
            </div>

            <!-- Product 3 -->
            <div class="bg-blue-100 p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6KvWP3G3-wFsMBNhLw3nYJ1_e0obRkZI_D9A9-L368g&s=10" class="w-full">
                <h3 class="text-xl">Headphones</h3>
                <p>Price: ₹3,499</p>
                <button class="bg-blue-600 text-white p-2 mt-2">Buy Now</button>
            </div>

            <!-- Product 4 -->
            <div class="bg-blue-100 p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeGhGSp71xnuzbE4vhfVG8dnmAaQRDfImIz0NA3EIiSQ&s=10" class="w-full">
                <h3 class="text-xl">Watch</h3>
                <p>Price: ₹7,499</p>
                <button class="bg-blue-600 text-white p-2 mt-2">Buy Now</button>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center p-4">
        MyCart © 2026
    </footer>

</body>
</html>
