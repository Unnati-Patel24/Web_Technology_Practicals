<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="Welcome.html" novalidate autocomplete="on" method="get">
         <fieldset>
        <legend>Personal Information</legend>
        <label>Full Name: </label>
        <input type="text" required/>
    </br>
    <br/>

    <label>Email: </label>
        <input type="email" required/>
    </br>
    <br/>

    <label>Password: </label>
        <input type="password" required/>
    </br>
    <br/>

    <label>Phone Number: </label>
        <input type="tel" required/>
    </br>
    <br/>

    <label>Age: </label>
        <input type="number" required/>
    </br>
    <br/>

    <label>Gender: </label>
        <input type="radio"/><label>Male</label>
        <input type="radio"/><label>Female</label>
    </br>
    <br/>
    </fieldset>

    <fieldset>
        <legend>Preferences & Extras</legend>
        <label>Upload Profile Picture: </label>
        <input type="file"/>
    </br>
    <br/>

    <label>Color: </label>
        <input type="color"/>
    </br>
    <br/>

    <label>search Course: </label>
        <input type="search" required/>
    </br>
    <br/>

    <label>Course Intrest Range: </label>
        <input type="range"/>
    </br>
    <br/>

    <label>Personal Website: </label>
        <input type="url" required/>
    </br>
    <br/>

    <label>Course Type: </label>
        <select>
            <optgroup label="Engineering">
            <option>CE</option>
            <option>CSE</option>
            <option>AI</option>
            <option>ME</option>
            </optgroup>

             <optgroup label="Others">
            <option>Physcology</option>
            <option>Archiology</option>
            <option>Music</option>
            <option>Law</option>
            </optgroup>
        </select>
    </br>
    <br/>

    
    <label>Preffered Country: </label>
    <input list="Countries">
        <datalist id="Countries">
            <option>USA</option>
            <option>India</option>
            <option>UAE</option>
            <option>UK</option>
            <option>Russia</option>
            <option>Europe</option>
            <option>South Korea</option>
        </datalist>
    </br>
    <br/>

      <label>Agree To Terms: </label>
        <input type="checkbox"/><label>I Agree</label>
    </br>
    <br/>
    </fieldset>

    <fieldset>
        <legend>Date & Time Info</legend>
        <label>Select Date Of Birth: </label>
        <input type="date"/>
    <br/>
    <br/>

    <label>Select Time: </label>
        <input type="time"/>
    <br/>
    <br/>

    <label>Select Month: </label>
        <input type="month"/>
    <br/>
    <br/>

    <label>Select Week: </label>
        <input type="Week"/>
    <br/>
    <br/>

    <label>Select Date & Time: </label>
        <input type="datetime-local"/>
    <br/>
    <br/>
    </fieldset>

    <fieldset>
        <legend>Form Controls</legend>
        <button type ="button">Click Me</button>
    </br>
    <br/>

    <input type="image" src="black-hole.png" alt="Logo For Registration Now" height="50" width="50">
    </br>
    <br/>

    <input type="submit" value="Register Now">
    </br>
    <br/>

    <input type="reset">
    </br>
    <br/>

    </fieldset>

    </form>
   
    
</body>
</html>
