<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Child Property</title>
    <style>
        .comman{
            height: 200px;
            background-color: yellow;
            border: 4px solid mediumpurple;
            margin: 10px;
            text-align: center;
        }

        .container{
            height: 300px;
            background-color: purple;
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .box1{
            flex-grow: 3;
            flex-basis: 200px;
            flex-shrink: 4;
            align-self: flex-start;
            order: 3;
        }
        .box2{
            flex-grow: 2;
            order: 5;
        }

        .box3{
            flex-basis: 100px;
            order: 2;
        }
        .box4{
            flex-shrink: 2;
            order: 1;
        }
        .box5{
            flex: 3 4 200px;
            order: 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="comman box1">BOX 1</div>
        <div class="comman box2">BOX 2</div>
        <div class="comman box3">BOX 3</div>
        <div class="comman box4">BOX 4</div>
        <div class="comman box5">BOX 5</div>
    </div>
</body>
</html>
